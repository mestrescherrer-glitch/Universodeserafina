<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Serafina — Quebra-cabeça da Lua</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07112f;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:14px}h1{font-size:clamp(22px,5vw,34px);margin:5px 0 8px}.wrap{max-width:760px;margin:auto}.intro{margin:0 auto 12px;line-height:1.4}.panels{display:flex;gap:12px;justify-content:center;align-items:flex-start;flex-wrap:wrap}.card{background:#101f4b;border:1px solid #41558f;border-radius:16px;padding:10px;box-shadow:0 8px 24px #0005}.card h2{font-size:16px;margin:2px 0 8px}.reference{width:min(300px,92vw)}#ref{width:100%;display:block;border-radius:10px;background:#050a20}.game{width:min(430px,92vw)}#board{width:100%;height:auto;display:block;border-radius:10px;background:#050a20;touch-action:none}.stats{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:9px 0;font-weight:bold;font-size:14px}.buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;cursor:pointer;background:#ffd84d;color:#1c2455}button.secondary{background:#8ed8ff}button.danger{background:#ff8c9d}.hint{font-size:13px;opacity:.9;margin:9px 0 0}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{background:#101f4b;border:1px solid #8ed8ff;border-radius:16px;padding:14px;max-width:520px;width:100%}.modalbox img{width:100%;border-radius:10px}.modalbox button{margin-top:10px}.message{min-height:25px;font-weight:bold;margin-top:8px;color:#ffe57b}
</style>
</head>
<body>
<div class="wrap">
<h1>🌙 Serafina — Quebra-cabeça da Lua</h1>
<p class="intro">Observe a imagem de referência e organize as peças para reconstruir a cena espacial!</p>
<div class="panels">
<section class="card reference"><h2>🖼️ Imagem de referência</h2><canvas id="ref" width="420" height="420"></canvas><button class="secondary" id="viewBtn">👁️ Ver imagem completa</button></section>
<section class="card game"><h2 id="phaseTitle">Fase 1 — Chegada à Lua</h2><canvas id="board" width="420" height="420"></canvas><div class="stats"><span>Movimentos: <b id="moves">0</b></span><span>Tempo: <b id="time">0</b>s</span></div><div class="buttons"><button id="shuffleBtn">🔀 Embaralhar</button><button class="danger" id="endBtn">⏹️ Encerrar</button></div><div class="message" id="message"></div><p class="hint">Toque ou clique em duas peças para trocar de lugar.</p></section>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><h2>🖼️ Observe a imagem</h2><img id="modalImg" alt="Imagem completa da fase"><button id="closeBtn">Fechar</button></div></div>
<script>
const ref=document.getElementById('ref'), board=document.getElementById('board'), rctx=ref.getContext('2d'), ctx=board.getContext('2d');
const phases=[
 ['Fase 1 — Chegada à Lua',3,'🌙'],['Fase 2 — Entre os planetas',4,'🪐'],['Fase 3 — Observando estrelas',4,'⭐'],['Fase 4 — Explorando a nebulosa',5,'🌌'],['Fase 5 — Perto de Saturno',5,'🛰️'],['Fase 6 — Grande missão lunar',6,'🚀']
];
let phase=0,grid=3,tiles=[],selected=-1,moves=0,seconds=0,timer=null,active=true;
function scene(c,w=420,h=420){c.clearRect(0,0,w,h);let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#07113b');g.addColorStop(1,'#24105b');c.fillStyle=g;c.fillRect(0,0,w,h);for(let i=0;i<80;i++){c.fillStyle=i%3?'#fff':'#ffe77a';c.globalAlpha=.45+(i%5)/10;c.beginPath();c.arc((i*73)%w,(i*41)%h,1+(i%3),0,Math.PI*2);c.fill()}c.globalAlpha=1;c.fillStyle='#f5e7a5';c.beginPath();c.arc(315,115,62,0,Math.PI*2);c.fill();c.fillStyle='#d7c985';[[295,95,9],[335,125,12],[300,140,6],[350,90,5]].forEach(p=>{c.beginPath();c.arc(p[0],p[1],p[2],0,Math.PI*2);c.fill()});c.fillStyle='#ffcf45';c.font='bold 44px Arial';c.fillText('★',45,75);c.fillText('★',350,300);c.fillStyle='#69d8ff';c.beginPath();c.ellipse(105,310,54,22,-.2,0,Math.PI*2);c.fill();c.fillStyle='#b8f0ff';c.font='bold 42px Arial';c.fillText('🚀',155,275);c.fillStyle='#fff';c.font='bold 18px Arial';c.fillText('Serafina no espaço',118,385)}
function makeReference(){scene(rctx);document.getElementById('modalImg').src=ref.toDataURL('image/png')}
function shuffle(){let arr=Array.from({length:grid*grid},(_,i)=>i);do{for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}while(arr.every((v,i)=>v===i));tiles=arr;selected=-1;moves=0;seconds=0;document.getElementById('moves').textContent=moves;document.getElementById('time').textContent=seconds;document.getElementById('message').textContent='';active=true;clearInterval(timer);timer=setInterval(()=>{if(active){seconds++;document.getElementById('time').textContent=seconds}},1000);drawBoard()}
function drawBoard(){let size=420/grid;ctx.clearRect(0,0,420,420);for(let pos=0;pos<tiles.length;pos++){let src=tiles[pos],sx=(src%grid)*size,sy=Math.floor(src/grid)*size,dx=(pos%grid)*size,dy=Math.floor(pos/grid)*size;ctx.drawImage(ref,sx,sy,size,size,dx,dy,size,size);ctx.strokeStyle='#fff8';ctx.lineWidth=1;ctx.strokeRect(dx,dy,size,size);if(pos===selected){ctx.strokeStyle='#ffe14d';ctx.lineWidth=5;ctx.strokeRect(dx+2,dy+2,size-4,size-4)}}}
function clickBoard(e){if(!active)return;let rect=board.getBoundingClientRect(),x=(e.clientX-rect.left)*420/rect.width,y=(e.clientY-rect.top)*420/rect.height;let pos=Math.floor(y/(420/grid))*grid+Math.floor(x/(420/grid));if(selected<0){selected=pos}else if(selected===pos){selected=-1}else{[tiles[selected],tiles[pos]]=[tiles[pos],tiles[selected]];moves++;document.getElementById('moves').textContent=moves;selected=-1;if(tiles.every((v,i)=>v===i)){active=false;clearInterval(timer);document.getElementById('message').textContent='🎉 Muito bem! Você completou esta fase!';setTimeout(()=>{if(phase<phases.length-1){phase++;startPhase()}else document.getElementById('message').textContent='🏆 Parabéns! Você concluiu todas as missões!'},900)}}drawBoard()}
function startPhase(){grid=phases[phase][1];document.getElementById('phaseTitle').textContent=phases[phase][0];makeReference();shuffle()}
board.addEventListener('pointerdown',clickBoard);document.getElementById('shuffleBtn').onclick=shuffle;document.getElementById('endBtn').onclick=()=>{active=false;clearInterval(timer);document.getElementById('message').textContent='Missão encerrada. Clique em Embaralhar para tentar novamente.'};document.getElementById('viewBtn').onclick=()=>document.getElementById('modal').classList.add('show');document.getElementById('closeBtn').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};startPhase();
</script>
</body></html>
